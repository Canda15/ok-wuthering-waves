name: 构建 NoNo 启动器
run-name: NoNo 1.2.7 启动器 · ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 核验后发布新的 launcher-2；默认仅上传审阅工件。
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  launcher:
    name: 编译与审阅工件
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 配置换行与路径
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true
      - name: 检出本次源码
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 构建并验证新版启动器
        id: launcher
        uses: ./.github/actions/build-nono-launcher
      - name: 生成启动器工件和校验文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'build/launcher-release/NoNo' -Force | Out-Null
          Copy-Item -LiteralPath 'build/launcher-dist/NoNo.exe' -Destination 'build/launcher-release/NoNo/NoNo.exe'
          Compress-Archive -LiteralPath 'build/launcher-release/NoNo' -DestinationPath 'build/launcher-dist/NoNo-win32.zip' -Force
          $hash = (Get-FileHash -LiteralPath 'build/launcher-dist/NoNo-win32.zip' -Algorithm SHA256).Hash.ToLower()
          $checksumText = $hash + '  NoNo-win32.zip' + [char]10
          [IO.File]::WriteAllText([IO.Path]::GetFullPath('build/launcher-dist/NoNo-win32-sha256.txt'), $checksumText, [Text.Encoding]::ASCII)
      - name: 上传可审阅启动器工件
        uses: actions/upload-artifact@v4
        with:
          name: NoNo-launcher-1.2.7-${{ github.sha }}
          path: |
            build/launcher-dist/NoNo-win32.zip
            build/launcher-dist/NoNo-win32-sha256.txt
            build/launcher-dist/launcher-build.json
          if-no-files-found: error
          retention-days: 14
  publish:
    name: 发布新固定启动器
    needs: launcher
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    concurrency:
      group: nono-fixed-launcher-2
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: 下载已核验工件
        uses: actions/download-artifact@v4
        with:
          name: NoNo-launcher-1.2.7-${{ github.sha }}
          path: launcher-release
      - name: 拒绝覆盖已有固定标签
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          for endpoint in ('git/ref/tags/launcher-2', 'releases/tags/launcher-2'):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}/{endpoint}",
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      continue
                  raise SystemExit('固定标签查询失败，禁止继续发布。') from None
              raise SystemExit('launcher-2 已存在，禁止覆盖或移动固定标签。')
          PY
      - name: 发布新的固定工件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-2
          target_commitish: ${{ github.sha }}
          name: NoNo 1.2.7 启动器
          make_latest: 'false'
          fail_on_unmatched_files: true
          body: |
            固定官方 v1.2.7 源码、NoNo 接收协议与品牌编译的启动器。
            源码、统一差异、PE、图标和 UAC 证明见 launcher-build.json。
            此资源供完整便携打包器使用；用户升级请下载完整 NoNo-win32-portable.zip。
            保留旧 launcher-1，不覆盖旧版本。
          files: |
            launcher-release/NoNo-win32.zip
            launcher-release/NoNo-win32-sha256.txt
            launcher-release/launcher-build.json
