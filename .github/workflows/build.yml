name: Windows 发布
run-name: Windows 发布 · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  # 自维护分支用:GITHUB_TOKEN 推的 tag 不会触发 build(push 事件禁止 token 递归
  # 触发),sync-upstream 工作流因此在推完 tag 后显式派发一次,并且必须带 tag 作为
  # ref——ref_name 就是发布版本号,派到分支上会打出错误版本。
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'
  # 固定启动器来源、打包和实际便携验证统一由 selfhost/portable.py 维护。

jobs:
  validate:
    name: 1 · 验证
    runs-on: windows-latest

    steps:
      # 手动触发时 GitHub 允许选任意 ref,而版本号取自 github.ref_name:
      # 选到分支会得到一个叫 master 的“版本”,启动器 setup 会因
      # `Invalid setup version tag 'master'` 失败,镜像仓库还会多一个同名 tag。
      # 所以第一件事就把 ref 钉死成发布用的版本 tag,后面所有步骤都能假设
      # RELEASE_TAG 形如 v3.7.17(与 pyappify 的标签正则一致)。
      - name: 检查发布标签
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            throw "这个工作流必须以 tag 为 ref 运行(当前 $env:GITHUB_REF)。要在 Actions 里手动跑,请把 Branch 下拉切到某个 tag;要合并上游并发布新版本,请手动运行 'Sync upstream release'。"
          }
          if ($env:GITHUB_REF_NAME -notmatch '^v?\d+\.\d+\.\d+(?:[-.](?:alpha|beta|rc)(?:\.\d+)?)?$') {
            throw "tag '$env:GITHUB_REF_NAME' 不是 PyAppify 支持的正式或 alpha/beta/rc 标签"
          }

      - name: 配置构建机
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "Canda15"

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: 准备 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: 安装依赖
        run: python .github/scripts/install_dependencies.py

      - name: 核对内联框架与逻辑差异
        shell: pwsh
        run: python scripts/sync_ok.py --check

      - name: 准备发布依赖
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: 运行测试
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          CNB_TOKEN: ''
          OK_GH: ''
          SIGNPATH_API_TOKEN: ''
          GEMINI_API_KEY: ''
          AI_API_KEY: ''
          MirrorChyanUploadToken: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: |
          @(
            'GITHUB_TOKEN',
            'GH_TOKEN',
            'CNB_TOKEN',
            'OK_GH',
            'SIGNPATH_API_TOKEN',
            'GEMINI_API_KEY',
            'AI_API_KEY',
            'MirrorChyanUploadToken',
            'ACTIONS_RUNTIME_TOKEN',
            'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
          ) | ForEach-Object {
            Remove-Item "Env:\$_" -ErrorAction SilentlyContinue
          }

          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
            Write-Host "Running tests in $($_.FullName)"
            python -u run_test.py $_.FullName

            if ($LASTEXITCODE -ne 0) {
              throw "Tests failed in $($_.FullName)"
            }
          }

  synchronize:
    name: 2 · 同步更新镜像
    needs: validate
    runs-on: windows-latest
    outputs:
      is_release: ${{ steps.release_version.outputs.is_release }}
      start_tag: ${{ steps.sync.outputs.start_tag }}
      end_tag: ${{ steps.sync.outputs.end_tag }}
      changes: ${{ steps.sync.outputs.changes_with_asterisk }}

    steps:
      - name: 配置构建机
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "Canda15"

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: 准备 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: 安装依赖
        run: python .github/scripts/install_dependencies.py

      - name: 准备发布依赖
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: 检查正式与预发布版本
        id: release_version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $isRelease = $env:RELEASE_TAG -match '^v?\d+\.\d+\.\d+$'
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $isRelease"

      # 把部署树(deploy.txt 白名单)推到更新仓库 nono-update,并同步 tag。
      # 更新源必须是一个只含部署树的仓库:启动器 setup 时会整棵克隆它,
      # 直接指向源码仓库会连带下载 ok_templates(839 MB)和 tests(124 MB),
      # 既拖慢 setup 也可能撞上 Windows 长路径限制。
      # 认证走 secrets.UPDATE_TOKEN(带 repo 权限的 PAT),action 本身不接受
      # token 输入,只能把凭据嵌进 repos 的 URL 里。
      # 注意:上一步的 inline_ok_requirements 已经把 config.py 的 version 改成本次
      # tag、并从 requirements.txt 摘掉 ok-script,所以镜像仓库里就是可发布的树。
      # 业务宿主也必须在同步之前编译，selfhost/ 白名单会把 EXE 一起推入部署树。
      - name: 同步镜像前核对内联框架
        shell: pwsh
        run: python scripts/sync_ok.py --check

      - name: 编译并验证业务 EXE
        shell: pwsh
        run: .\scripts\build_runtime.ps1

      - name: 记录镜像对应的源码
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          UPDATE_MIRROR: https://github.com/Canda15/nono-update.git
        # 镜像提交与源码提交不同；保存来源供同号补发核对，文件随 selfhost 部署白名单同步。
        run: |
          python scripts/upstream_release.py record --upstream-tag "$env:RELEASE_TAG" --mirror "$env:UPDATE_MIRROR"
          if ($LASTEXITCODE -ne 0) { throw '镜像来源核对或记录失败' }

      - name: 同步更新镜像
        id: sync
        uses: ok-oldking/partial-sync-repo@master
        with:
          repos: |
            https://x-access-token:${{ secrets.UPDATE_TOKEN }}@github.com/Canda15/nono-update.git
          sync_list: 'deploy.txt'
          tag: ${{ github.ref_name }}
          gitignore_file: '.update_repo_gitignore'
          show_author: true

  package:
    name: 3 · 构建完整便携包
    needs: synchronize
    timeout-minutes: 90
    runs-on: windows-latest

    steps:
      - name: 配置构建机
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "Canda15"
          # setup 时启动器用 libgit2 克隆镜像仓库,libgit2 默认不认长路径
          # (GIT_LONGPATHS_DEFAULT = false);这里提前打开,免得将来资源文件名
          # 变长后又在 "path too long" 上失败。
          git config --global core.longpaths true

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: 准备部署树校验用 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装候选与来源验证依赖
        run: python .github/scripts/install_dependencies.py

      - name: 从固定源码构建新版启动器
        id: launcher
        uses: ./.github/actions/build-nono-launcher

      # 正式发布仍由 setup 克隆镜像的本次 tag，复用完整便携验证和归档入口。
      - name: 生成并验证正式便携包
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m selfhost.portable --release-tag "$env:RELEASE_TAG" --launcher-exe build/launcher-dist/NoNo.exe --launcher-proof build/launcher-dist/launcher-build.json

      - name: 上传发布工件
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            build/portable-dist/NoNo-win32-portable.zip
            build/portable-dist/NoNo-win32-sha256.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 4 · 发布
    needs: [ synchronize, package ]
    runs-on: ubuntu-latest

    steps:
      - name: 下载发布工件
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: pyappify_dist

      - name: 读取应用版本
        id: app_version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub 发布
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            ### 更新日志 -> ${{ needs.synchronize.outputs.end_tag }}
              自上次同步以来部署树的改动(mirror 仓库视角,不含上游提交正文):
              ${{ needs.synchronize.outputs.changes }}
            ### 便携版
              下载 `NoNo-win32-portable.zip`,解压到任意目录后双击 `NoNo\NoNo.exe`。
              Python 运行时、依赖、脚本、配置和日志都在解压出来的目录里,
              整个目录可以直接搬走或做备份,不需要安装。升级时退出旧 NoNo,把新便携包解压覆盖原目录后启动,配置会自动保留并迁移。
            ### 源码运行
              参阅[源码开发说明](https://github.com/Canda15/ok-wuthering-waves/blob/master/docs/development/contributing.md).
          draft: false
          prerelease: ${{ needs.synchronize.outputs.is_release != 'true' }}
          files: pyappify_dist/*
