name: Windows Release
run-name: Windows release · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  # 自维护分支用:GITHUB_TOKEN 推的 tag 不会触发 build(push 事件禁止 token 递归
  # 触发),sync-upstream 工作流因此在推完 tag 后显式派发一次,并且必须带 tag 作为
  # ref——ref_name 就是发布版本号,派到分支上会打出错误版本。
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'
  # 便携产物的底座:一个 pyappify 启动器(4.7 MB,解压后只有一个 exe)。
  # 我们不再用 ok-oldking/pyappify-action——它每次都先用 cargo 重新编译 Tauri
  # 启动器(9m17s),再用 makensis 把整棵树压成 NSIS 安装包(两遍,共约 8 分钟)。
  # 便携版不需要 NSIS:启动器的所有路径都相对自身所在目录,setup 出来的目录
  # 本身就是便携版(详见 package job 的注释)。
  #
  # 启动器由 .github/workflows/build-launcher.yml 自己编译,挂在 launcher-1 这个
  # 固定 tag 的 release 上:上游那份 exe 的 PE 版本信息里写着 ok-ww,只有自己编
  # 才能把名字写进去。这里钉死到那个 tag 而不是 /latest/,否则哪天应用发版了,
  # latest 会解析到应用发布页上(那里没有启动器)。
  # 重建启动器时如果换了 tag(launcher-2),这里要同步改。
  BASE_EXE_URL: 'https://github.com/Canda15/ok-wuthering-waves/releases/download/launcher-1/NoNo-win32.zip'

jobs:
  validate:
    name: 1 · Validate
    runs-on: windows-latest

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "Canda15"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python .github/scripts/install_dependencies.py

      - name: Prepare release requirements
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Run tests
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          CNB_TOKEN: ''
          OK_GH: ''
          SIGNPATH_API_TOKEN: ''
          GEMINI_API_KEY: ''
          AI_API_KEY: ''
          MirrorChyanUploadToken: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: |
          @(
            'GITHUB_TOKEN',
            'GH_TOKEN',
            'CNB_TOKEN',
            'OK_GH',
            'SIGNPATH_API_TOKEN',
            'GEMINI_API_KEY',
            'AI_API_KEY',
            'MirrorChyanUploadToken',
            'ACTIONS_RUNTIME_TOKEN',
            'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
          ) | ForEach-Object {
            Remove-Item "Env:\$_" -ErrorAction SilentlyContinue
          }

          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
            Write-Host "Running tests in $($_.FullName)"
            python -u run_test.py $_.FullName

            if ($LASTEXITCODE -ne 0) {
              throw "Tests failed in $($_.FullName)"
            }
          }

  synchronize:
    name: 2 · Synchronize repositories
    needs: validate
    runs-on: windows-latest
    outputs:
      is_release: ${{ steps.release_version.outputs.is_release }}
      start_tag: ${{ steps.sync.outputs.start_tag }}
      end_tag: ${{ steps.sync.outputs.end_tag }}
      changes: ${{ steps.sync.outputs.changes_with_asterisk }}

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "Canda15"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python .github/scripts/install_dependencies.py

      - name: Prepare release requirements
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Check release version
        id: release_version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $isRelease = $env:RELEASE_TAG -match '^v?\d+\.\d+\.\d+$'
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $isRelease"

      # 把部署树(deploy.txt 白名单)推到更新仓库 nono-update,并同步 tag。
      # 更新源必须是一个只含部署树的仓库:启动器 setup 时会整棵克隆它,
      # 直接指向源码仓库会连带下载 ok_templates(839 MB)和 tests(124 MB),
      # 既拖慢 setup 也可能撞上 Windows 长路径限制。
      # 认证走 secrets.UPDATE_TOKEN(带 repo 权限的 PAT),action 本身不接受
      # token 输入,只能把凭据嵌进 repos 的 URL 里。
      # 注意:上一步的 inline_ok_requirements 已经把 config.py 的 version 改成本次
      # tag、并从 requirements.txt 摘掉 ok-script,所以镜像仓库里就是可发布的树。
      - name: Synchronize the update repository
        id: sync
        uses: ok-oldking/partial-sync-repo@master
        with:
          repos: |
            https://x-access-token:${{ secrets.UPDATE_TOKEN }}@github.com/Canda15/nono-update.git
          sync_list: 'deploy.txt'
          tag: ${{ github.ref_name }}
          gitignore_file: '.update_repo_gitignore'
          show_author: true

  package:
    name: 3 · Build portable bundle
    needs: synchronize
    runs-on: windows-latest

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "Canda15"
          # setup 时启动器用 libgit2 克隆镜像仓库,libgit2 默认不认长路径
          # (GIT_LONGPATHS_DEFAULT = false);这里提前打开,免得将来资源文件名
          # 变长后又在 "path too long" 上失败。
          git config --global core.longpaths true

      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      # 便携版不需要 NSIS:启动器的路径全部相对自身所在目录
      # (utils/path.rs 用 current_dir,lib.rs 启动时强制 set_current_dir(exe_dir)),
      # 既不写注册表也不写 %APPDATA%——所以 "下载启动器 + 跑一次 setup" 得到的目录
      # 可以整体搬走,就是一个便携版。安装包只是把这个目录复制到 Program Files。
      - name: Fetch base launcher
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'base-launcher.zip'
          Invoke-WebRequest -Uri $env:BASE_EXE_URL -OutFile $archive
          # zip 结构是 NoNo/NoNo.exe(build-launcher.yml 打的),解到独立目录,
          # 与后面要产出的便携目录 pyappify_dist\NoNo 区分开。
          Expand-Archive -LiteralPath $archive -DestinationPath 'pyappify_dist\launcher' -Force
          $exe = 'pyappify_dist\launcher\NoNo\NoNo.exe'
          if (-not (Test-Path $exe)) { throw "启动器包里没有 $exe" }
          # 防回归:BASE_EXE_URL 一旦指回上游那份 exe,这里立刻红,而不是等到
          # 用户在文件属性里看到 ok-ww。
          $info = (Get-Item $exe).VersionInfo
          "启动器: ProductName=$($info.ProductName) FileVersion=$($info.FileVersion)"
          if ($info.ProductName -match 'ok-ww|ok-script') {
            throw "启动器的 PE 元数据仍是上游名字: $($info.ProductName)"
          }

      - name: Build portable bundle
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $bundle = 'pyappify_dist\NoNo'
          New-Item -ItemType Directory -Force $bundle | Out-Null
          # 启动器不自我重命名(pyappify 的 Rust 侧只用 current_exe 重启自己),
          # 文件名来自 pyappify.yml 的 name;data/apps/<name> 那个目录名也由它决定。
          Copy-Item 'pyappify_dist\launcher\NoNo\NoNo.exe' (Join-Path $bundle 'NoNo.exe')

          # 启动器在 cwd 读 pyappify.yml(app.rs:198 read_embedded_app),读不到就
          # 退回 pyappify 自带的默认配置——那样既没有我们的 profile 也没有镜像仓库
          # 地址,setup 会跑去克隆上游。必须把本仓库这份放在 exe 旁边。
          Copy-Item 'pyappify.yml' $bundle

          # 把 Python 运行时、依赖、部署树(镜像仓库的 tag)一次性装进 $bundle。
          # 启动器是 GUI 子系统的 exe:用 & 调用不会等待,$LASTEXITCODE 还是空,
          # 于是"假装成功了"。必须 Start-Process -Wait 并读 ExitCode。
          $stdout = Join-Path $env:RUNNER_TEMP 'setup.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'setup.stderr.log'
          $launcher = Join-Path $bundle 'NoNo.exe'
          $setupArgs = @('-c', 'setup', '-p', 'China', '--setup-version', $env:RELEASE_TAG)
          $process = Start-Process -FilePath $launcher -ArgumentList $setupArgs `
            -WorkingDirectory $bundle -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content $stdout -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          Get-Content $stderr -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          if ($process.ExitCode -ne 0) { throw "启动器 setup 失败,退出码 $($process.ExitCode)" }

          # data\apps\<name>\repo 就是部署树;没有它说明 setup 没真正跑完。
          # <name> 来自 pyappify.yml,改名后要与它保持一致。
          $repo = Join-Path $bundle 'data\apps\NoNo\repo'
          if (-not (Test-Path (Join-Path $repo 'main.py'))) { throw "setup 结束但 $repo\main.py 不存在" }

          # pip 缓存和运行日志是运行期产物:pip 缓存动辄上百 MB,不随包分发。
          foreach ($dir in @('cache', 'data\logs')) {
            $path = Join-Path $bundle $dir
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }

          Get-ChildItem $bundle | Select-Object Name
          "便携目录体积: {0:N0} MB" -f ((Get-ChildItem $bundle -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Pack portable bundle
        shell: pwsh
        run: |
          Push-Location 'pyappify_dist'
          try {
            $zip = 'NoNo-win32-portable.zip'
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
            if (Test-Path $sevenZip) {
              # 7z 比 Compress-Archive 快一个数量级(便携目录有几万个文件),
              # 压缩率也更好。这里用标准 zip 容器,Windows 资源管理器可直接解压。
              & $sevenZip a -tzip -mx=5 -bsp1 $zip 'NoNo'
              if ($LASTEXITCODE -ne 0) { throw "7z 打包失败,退出码 $LASTEXITCODE" }
            } else {
              Compress-Archive -Path 'NoNo' -DestinationPath $zip -CompressionLevel Optimal
            }
          } finally {
            Pop-Location
          }

          # 只留发布要用的两样:便携包与校验文件(启动器不再随发布分发,
          # 它的来源是 env.BASE_EXE_URL 钉住的那份固定资产)。
          Remove-Item 'pyappify_dist\NoNo' -Recurse -Force
          Remove-Item 'pyappify_dist\launcher' -Recurse -Force

          $file = 'NoNo-win32-portable.zip'
          $hash = (Get-FileHash "pyappify_dist\$file" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $file" | Set-Content 'pyappify_dist\NoNo-win32-sha256.txt' -Encoding ascii
          Get-ChildItem 'pyappify_dist' | Select-Object Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: pyappify_dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 4 · Publish
    needs: [ synchronize, package ]
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: pyappify_dist

      - name: Get app version
        id: app_version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            ### 更新日志 ${{ needs.synchronize.outputs.start_tag }} -> ${{ needs.synchronize.outputs.end_tag }}:
              ${{ needs.synchronize.outputs.changes }}
            ### 便携版
              下载 `NoNo-win32-portable.zip`,解压到任意目录后双击 `NoNo\NoNo.exe`。
              Python 运行时、依赖、脚本、配置和日志都在解压出来的目录里,
              整个目录可以直接搬走或做备份,不需要安装。
            ### Install from source
              See the [source installation guide](https://github.com/Canda15/ok-wuthering-waves/blob/master/docs/development/contributing.md).
          draft: false
          prerelease: ${{ needs.synchronize.outputs.is_release != 'true' }}
          files: pyappify_dist/*
