name: Windows Release
run-name: Windows release · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  # 自维护分支用:GITHUB_TOKEN 推的 tag 不会触发 build(push 事件禁止 token 递归
  # 触发),sync-upstream 工作流因此在推完 tag 后显式派发一次,并且必须带 tag 作为
  # ref——ref_name 就是发布版本号,派到分支上会打出错误版本。
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'
  # 上游用 SignPath 的证书签安装包,那份证书绑定 ok-oldking 的组织,自维护
  # 分支没有也不需要。SIGN_BUILD 同时决定"只构建 exe"与是否进入签名步骤,
  # 保持 false 就既不签名也能构建完整安装包。
  SIGN_BUILD: 'false'
  BUILD_EXE: 'true'
  # 复用上一次发布里的启动器 ok-ww-win32.zip,跳过用 cargo 重新编译 Tauri/Rust
  # 启动器(实测 9分17秒,占打包 step 的一半)。启动器本身与版本无关:版本号
  # 由 pyappify 在 setup 时按仓库 tag 生成,所以复用旧 exe 不会让包"变旧"。
  # 代价:launcher 从此冻结在首次发布的那份二进制上,要重建就临时把这行注释掉
  # 跑一次 build,再恢复。
  USE_RELEASE: 'https://api.github.com/repos/Canda15/ok-wuthering-waves/releases/latest'

jobs:
  validate:
    name: 1 · Validate
    runs-on: windows-latest

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "Canda15"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python .github/scripts/install_dependencies.py

      - name: Prepare release requirements
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Run tests
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          CNB_TOKEN: ''
          OK_GH: ''
          SIGNPATH_API_TOKEN: ''
          GEMINI_API_KEY: ''
          AI_API_KEY: ''
          MirrorChyanUploadToken: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: |
          @(
            'GITHUB_TOKEN',
            'GH_TOKEN',
            'CNB_TOKEN',
            'OK_GH',
            'SIGNPATH_API_TOKEN',
            'GEMINI_API_KEY',
            'AI_API_KEY',
            'MirrorChyanUploadToken',
            'ACTIONS_RUNTIME_TOKEN',
            'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
          ) | ForEach-Object {
            Remove-Item "Env:\$_" -ErrorAction SilentlyContinue
          }

          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
            Write-Host "Running tests in $($_.FullName)"
            python -u run_test.py $_.FullName

            if ($LASTEXITCODE -ne 0) {
              throw "Tests failed in $($_.FullName)"
            }
          }

  synchronize:
    name: 2 · Synchronize repositories
    needs: validate
    runs-on: windows-latest
    outputs:
      is_release: ${{ steps.release_version.outputs.is_release }}
      start_tag: ${{ steps.sync.outputs.start_tag }}
      end_tag: ${{ steps.sync.outputs.end_tag }}
      changes: ${{ steps.sync.outputs.changes_with_asterisk }}

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "Canda15"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python .github/scripts/install_dependencies.py

      - name: Prepare release requirements
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Check release version
        id: release_version
        if: env.BUILD_EXE == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $isRelease = $env:RELEASE_TAG -match '^v?\d+\.\d+\.\d+$'
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $isRelease"

      # 把部署树(deploy.txt 白名单)推到更新仓库 ok-ww-update,并同步 tag。
      # 更新源必须是一个只含部署树的仓库:pyappify 会把被克隆的整棵树塞进
      # NSIS 离线安装包,直接克隆源码仓库(ok_templates 839 MB)会让
      # makensis 报 "Internal compiler error #12345: error mmapping datablock"。
      # 认证走 secrets.UPDATE_TOKEN(带 repo 权限的 PAT),action 本身不接受
      # token 输入,只能把凭据嵌进 repos 的 URL 里。
      - name: Synchronize the update repository
        id: sync
        uses: ok-oldking/partial-sync-repo@master
        with:
          repos: |
            https://x-access-token:${{ secrets.UPDATE_TOKEN }}@github.com/Canda15/ok-ww-update.git
          sync_list: 'deploy.txt'
          tag: ${{ github.ref_name }}
          gitignore_file: '.update_repo_gitignore'
          show_author: true

  package:
    name: 3 · Build and optionally sign
    needs: synchronize
    runs-on: windows-latest
    env:
      # 上游这里按 is_release 打开 SignPath 签名;我们恒为 false(见文件头注释)。
      SIGN_BUILD: 'false'

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "Canda15"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python .github/scripts/install_dependencies.py

      - name: Prepare release requirements
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      # 打包器靠 libgit2 把本仓库克隆到 pyappify_dist/ok-ww/data/apps/ok-ww/repo,
      # 而 libgit2 默认不启用长路径支持;ok_templates/ 里有 180+ 字符的文件名,
      # 叠上这条深目录就超过 260 的 MAX_PATH,克隆失败在
      # "path too long: .../ok_templates/WindowsGraphicsCaptureMethod_..._original_png.rf.*.jpg"。
      # core.longpaths 写进全局 gitconfig 后 libgit2 改用 \\?\ 前缀,克隆才能完成。
      - name: Allow long paths when the packager clones the repo
        shell: pwsh
        run: |
          git config --global core.longpaths true
          Write-Host "core.longpaths = $(git config --global --get core.longpaths)"

      - name: Reuse base executable
        id: reuse_executable
        uses: ok-oldking/pyappify-action@master
        if: env.BUILD_EXE == 'true' && env.USE_RELEASE != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          use_release: ${{ env.USE_RELEASE }}
          add_version_name: true

      - name: Build portable executable
        id: build_executable
        uses: ok-oldking/pyappify-action@master
        if: env.BUILD_EXE == 'true' && env.USE_RELEASE == ''
        with:
          build_exe_only: ${{ env.SIGN_BUILD == 'true' }}
          add_version_name: true

      - name: Upload portable executable for signing
        id: upload_executable
        uses: actions/upload-artifact@v4
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true' && env.USE_RELEASE == ''
        with:
          name: portable-executable-to-sign
          path: ${{ steps.build_executable.outputs.exe-path }}
          if-no-files-found: error
          retention-days: 1

      - name: Sign portable executable
        id: sign_executable
        uses: signpath/github-action-submit-signing-request@v2.2
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true' && env.USE_RELEASE == ''
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '639bc6dd-9623-43cd-ac75-50a445898012'
          project-slug: 'ok-wuthering-waves'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'single-exe'
          github-artifact-id: '${{ steps.upload_executable.outputs.artifact-id }}'
          wait-for-completion: false

      - name: Approve portable executable signing
        uses: fjogeleit/http-request-action@v1
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true' && env.USE_RELEASE == ''
        with:
          url: 'https://app.signpath.io/API/v1/639bc6dd-9623-43cd-ac75-50a445898012/SigningRequests/${{ steps.sign_executable.outputs.signing-request-id }}/Approve'
          method: POST
          bearerToken: '${{ secrets.SIGNPATH_API_TOKEN }}'
          contentType: application/json
          data: '{}'
          preventFailureOnNoResponse: true
          retry: 60
          retryWait: 10000

      - name: Download signed portable executable
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true' && env.USE_RELEASE == ''
        shell: pwsh
        env:
          SIGNING_REQUEST_ID: ${{ steps.sign_executable.outputs.signing-request-id }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          OUTPUT_DIRECTORY: ${{ steps.build_executable.outputs.exe-folder }}
        run: |
          $baseUrl = "https://app.signpath.io/API/v1/639bc6dd-9623-43cd-ac75-50a445898012/SigningRequests/$env:SIGNING_REQUEST_ID"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $deadline = (Get-Date).AddSeconds(60000)

          do {
            $status = Invoke-RestMethod -Uri "$baseUrl/Status" -Headers $headers
            Write-Host "SignPath status: $($status.status) ($($status.workflowStatus))"

            if ($status.status -eq 'Completed') {
              break
            }

            if ($status.isFinalStatus) {
              throw "SignPath request ended with status '$($status.status)' ($($status.workflowStatus))."
            }

            if ((Get-Date) -ge $deadline) {
              throw 'Timed out waiting for SignPath to sign the portable executable.'
            }

            Start-Sleep -Seconds 10
          } while ($true)

          $archivePath = Join-Path $env:RUNNER_TEMP 'signed-portable-executable.zip'
          $outputDirectory = [System.IO.Path]::GetFullPath($env:OUTPUT_DIRECTORY)
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          Invoke-WebRequest -Uri "$baseUrl/SignedArtifact" -Headers $headers -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $outputDirectory -Force

      - name: Build installers
        id: build_installers
        uses: ok-oldking/pyappify-action@master
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'
        with:
          add_version_name: true

      - name: Upload China installer for signing
        id: upload_china_installer
        uses: actions/upload-artifact@v4
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'
        with:
          name: china-installer-to-sign
          path: pyappify_dist/ok-ww-win32-China-setup-*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign China installer
        id: sign_china_installer
        uses: signpath/github-action-submit-signing-request@v2.2
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '639bc6dd-9623-43cd-ac75-50a445898012'
          project-slug: 'ok-wuthering-waves'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'setupexe'
          github-artifact-id: '${{ steps.upload_china_installer.outputs.artifact-id }}'
          wait-for-completion: false

      - name: Approve China installer signing
        uses: fjogeleit/http-request-action@v1
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'
        with:
          url: 'https://app.signpath.io/API/v1/639bc6dd-9623-43cd-ac75-50a445898012/SigningRequests/${{ steps.sign_china_installer.outputs.signing-request-id }}/Approve'
          method: POST
          bearerToken: '${{ secrets.SIGNPATH_API_TOKEN }}'
          contentType: application/json
          data: '{}'
          preventFailureOnNoResponse: true
          retry: 60
          retryWait: 10000

      - name: Download signed China installer
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'
        shell: pwsh
        env:
          SIGNING_REQUEST_ID: ${{ steps.sign_china_installer.outputs.signing-request-id }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $baseUrl = "https://app.signpath.io/API/v1/639bc6dd-9623-43cd-ac75-50a445898012/SigningRequests/$env:SIGNING_REQUEST_ID"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $deadline = (Get-Date).AddSeconds(60000)

          do {
            $status = Invoke-RestMethod -Uri "$baseUrl/Status" -Headers $headers
            Write-Host "SignPath status: $($status.status) ($($status.workflowStatus))"

            if ($status.status -eq 'Completed') {
              break
            }

            if ($status.isFinalStatus) {
              throw "SignPath request ended with status '$($status.status)' ($($status.workflowStatus))."
            }

            if ((Get-Date) -ge $deadline) {
              throw 'Timed out waiting for SignPath to sign the China installer.'
            }

            Start-Sleep -Seconds 10
          } while ($true)

          $archivePath = Join-Path $env:RUNNER_TEMP 'signed-china-installer.zip'
          $outputDirectory = [System.IO.Path]::GetFullPath('pyappify_dist')
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          Invoke-WebRequest -Uri "$baseUrl/SignedArtifact" -Headers $headers -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $outputDirectory -Force

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        if: env.BUILD_EXE == 'true'
        with:
          name: release-assets
          path: pyappify_dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 4 · Publish
    needs: [ synchronize, package ]
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: pyappify_dist

      - name: Get app version
        id: app_version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            ### 更新日志 ${{ needs.synchronize.outputs.start_tag }} -> ${{ needs.synchronize.outputs.end_tag }}:
              ${{ needs.synchronize.outputs.changes }}
            ### Install from source
              See the [source installation guide](https://github.com/Canda15/ok-wuthering-waves/blob/master/docs/development/contributing.md).
          draft: false
          prerelease: ${{ needs.synchronize.outputs.is_release != 'true' }}
          files: pyappify_dist/*
