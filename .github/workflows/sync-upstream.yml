name: Sync upstream release

# 上游发版后把新版本合并进来、重新内联 ok-script、跑冒烟测试,全绿才推送并打 tag。
# 设计取舍:自动化真正危险的不是"合并冲突"(那是可见的、会失败的),而是
# "合并干净但启动 ImportError"——所以冒烟测试放在推送之前,红则什么都不推。
on:
  schedule:
    # 每 12 小时查一次。fork 的 schedule 在仓库 60 天无活动后会被 GitHub 自动禁用,
    # 手动跑一次 workflow_dispatch 即可重新启用。
    - cron: '23 */12 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 指定上游 tag(留空则取最新 release)
        required: false
      force:
        # 演练用:上游没有新版本时也想完整跑一遍(合并→重建 ok/→冒烟→打 tag)。
        description: 即使该 tag 已合并也继续执行
        type: boolean
        default: false

permissions:
  contents: write
  # 派发 build.yml 走的是 Workflow dispatch API,只给 contents: write 会 403
  # ("Resource not accessible by integration")——推送成功了但没开始构建。
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ok-oldking/ok-wuthering-waves
  UPDATE_MIRROR: https://github.com/Canda15/nono-update.git
  PYTHON_VERSION: '3.12'
  # runner 的控制台是 cp1252,不设这个变量时打印中文会 UnicodeEncodeError
  PYTHONIOENCODING: 'UTF-8'

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: 固定源码换行与路径
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          # 补丁头和来源摘要按原始 LF 字节校验，必须在 checkout 前禁用 CRLF 转换。
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve upstream tag
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          $tag = $env:UPSTREAM_TAG
          if (-not $tag) {
            $tag = gh api "repos/$env:UPSTREAM_REPO/releases/latest" --jq .tag_name
            if ($LASTEXITCODE -ne 0) { throw '读取上游版本失败' }
          }
          python -m selfhost.versioning "$tag" --upstream
          if ($LASTEXITCODE -ne 0) { throw '上游标签不是支持的官方版本格式' }
          Write-Host "upstream tag: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Skip when already merged
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.resolve.outputs.tag }}"
          $force = "${{ inputs.force }}"
          git remote add upstream "https://github.com/$env:UPSTREAM_REPO.git"
          # 上游提交与本仓库的同名发布标签不同，用独立引用防止抓取覆盖已发布标签。
          $upstreamRef = "refs/upstream-tags/$tag"
          git fetch --no-tags upstream "refs/tags/${tag}:${upstreamRef}"
          if ($LASTEXITCODE -ne 0) { throw '抓取上游标签失败' }
          # 官方来源与品牌发布分开；xmod Release 仍须由源码祖先和完整附件证明。
          $parameters = @('scripts/upstream_release.py', 'check', '--upstream-tag', $tag,
            '--repository', $env:GITHUB_REPOSITORY)
          if ($force -eq 'true') { $parameters += '--force' }
          $decisionJson = python @parameters
          if ($LASTEXITCODE -ne 0) { throw '检查上游发布覆盖失败' }
          $decision = $decisionJson | ConvertFrom-Json
          if ($decision.needed -isnot [bool]) { throw '发布覆盖结果格式不正确' }
          "needed=$($decision.needed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($decision.needed) {
            Write-Host "$tag 需要合并、验证或补发"
          } else {
            Write-Host "$tag 已由 $($decision.covered_tag) 的完整便携版本覆盖，无需同步"
          }
          exit 0

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.needed == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.resolve.outputs.tag }}"
          git config user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { throw '设置同步提交用户名失败' }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { throw '设置同步提交邮箱失败' }

          # 只规范受管输入字段和框架 pin，再做三方合并；保留本地开发依赖和上游其余更新。
          $mergeJson = python scripts/merge_upstream.py --upstream-tag "$tag"
          if ($LASTEXITCODE -ne 0) { throw '上游合并失败，未推送源码或发布标签' }
          $result = $mergeJson | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($result.framework_version)) { throw '缺少官方声明的框架版本' }
          "framework_version=$($result.framework_version)" >> $env:GITHUB_OUTPUT

      - name: Re-vendor ok-script
        if: steps.check.outputs.needed == 'true'
        shell: pwsh
        env:
          FRAMEWORK_VERSION: ${{ steps.merge.outputs.framework_version }}
        run: |
          # 先在隔离树重放品牌与逻辑差异；验证成功后才移除依赖 pin 并整体替换。
          # 这一步只用标准库，先做重放再安装依赖，避免重新装入上游 ok-script。
          # 合并时已经移除了 pin，显式传入从官方对象读取的版本，禁止回落到旧框架。
          python scripts/sync_ok.py --reapply --version "$env:FRAMEWORK_VERSION"
          # 必须显式判负:脚本崩了但后面的 git 命令成功时,pwsh 步骤仍会判绿,
          # 结果是"合并干净、ok/ 没更新、测试全绿"——最坏的一种假成功。
          if ($LASTEXITCODE -ne 0) { throw 'sync_ok.py 执行失败' }
          git add -A
          if ($LASTEXITCODE -ne 0) { throw '暂存框架同步结果失败' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host '框架源码无变化'
          } elseif ($LASTEXITCODE -eq 1) {
            $version = (Get-Content selfhost/ok_pin.json -Raw | ConvertFrom-Json).version
            git commit -m "other: 同步内联框架 $version"
            if ($LASTEXITCODE -ne 0) { throw '提交框架同步结果失败' }
          } else {
            throw '检查框架同步差异失败'
          }

      - name: 安装现有依赖
        if: steps.check.outputs.needed == 'true'
        shell: pwsh
        run: python .github/scripts/install_dependencies.py

      - name: 验证前台输入与自维护核心
        if: steps.check.outputs.needed == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: .\scripts\check_foreground.ps1

      - name: Push and tag
        if: steps.check.outputs.needed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 基础号沿用已验证上游；同基础的新修复使用 xmod 修订，历史标签不移动。
          $planJson = python scripts/upstream_release.py plan --upstream-tag "${{ steps.resolve.outputs.tag }}" --mirror "$env:UPDATE_MIRROR"
          if ($LASTEXITCODE -ne 0) { throw '核对本仓库同号发布失败' }
          $plan = $planJson | ConvertFrom-Json
          $tag = $plan.release_tag
          if ($plan.upstream_tag -ne "${{ steps.resolve.outputs.tag }}") { throw '发布来源必须与已核对的上游一致' }
          $validatedCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $validatedCommit -ne $plan.source_commit) {
            throw '待发布源码与已核对的验证提交不一致'
          }
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 1) {
            git tag -a $tag -m "同步上游 ${{ steps.resolve.outputs.tag }}，发布 $tag" $validatedCommit
            if ($LASTEXITCODE -ne 0) { throw '创建发布标签失败' }
          } elseif ($LASTEXITCODE -ne 0) {
            throw '检查发布标签失败'
          }
          $tagCommit = git rev-parse "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $validatedCommit) {
            throw '发布标签没有指向本次验证提交，拒绝构建旧版本'
          }
          git push --atomic origin HEAD:master "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw '原子推送源码与标签失败，未覆盖历史标签' }
          # 用 GITHUB_TOKEN 推的 tag 不会触发 build.yml(GitHub 禁止 token 递归
          # 触发 push 类事件),所以必须显式派发一次,否则源码合了、包没编译。
          # --repo 不能省:本仓库是 fork,gh 会把"仓库"解析成基仓库(上游),
          # 于是拿着只能访问自己仓库的 token 去派发上游的 build.yml → 403
          # "Resource not accessible by integration",而源码和标签已经推上去了。
          gh workflow run build.yml --ref $tag --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "派发 build.yml 失败(退出码 $LASTEXITCODE)" }
          Write-Host "已推送 $tag 并派发 build.yml"
