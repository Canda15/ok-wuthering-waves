name: Sync upstream release

# 上游发版后把新版本合并进来、重新内联 ok-script、跑冒烟测试,全绿才推送并打 tag。
# 设计取舍:自动化真正危险的不是"合并冲突"(那是可见的、会失败的),而是
# "合并干净但启动 ImportError"——所以冒烟测试放在推送之前,红则什么都不推。
on:
  schedule:
    # 每 12 小时查一次。fork 的 schedule 在仓库 60 天无活动后会被 GitHub 自动禁用,
    # 手动跑一次 workflow_dispatch 即可重新启用。
    - cron: '23 */12 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 指定上游 tag(留空则取最新 release)
        required: false
      force:
        # 演练用:上游没有新版本时也想完整跑一遍(合并→重建 ok/→冒烟→打 tag)。
        description: 即使该 tag 已合并也继续执行
        type: boolean
        default: false

permissions:
  contents: write
  # 派发 build.yml 走的是 Workflow dispatch API,只给 contents: write 会 403
  # ("Resource not accessible by integration")——推送成功了但没开始构建。
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ok-oldking/ok-wuthering-waves
  PYTHON_VERSION: '3.12'
  # runner 的控制台是 cp1252,不设这个变量时打印中文会 UnicodeEncodeError
  PYTHONIOENCODING: 'UTF-8'

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: 固定源码换行与路径
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          # 补丁头和来源摘要按原始 LF 字节校验，必须在 checkout 前禁用 CRLF 转换。
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve upstream tag
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          $tag = $env:UPSTREAM_TAG
          if (-not $tag) {
            $tag = gh api "repos/$env:UPSTREAM_REPO/releases/latest" --jq .tag_name
            if ($LASTEXITCODE -ne 0) { throw '读取上游版本失败' }
          }
          if ($tag -notmatch '^v?\d+\.\d+\.\d+(?:[-.](?:alpha|beta|rc)(?:\.\d+)?)?$') {
            throw '上游标签不是支持的版本格式'
          }
          Write-Host "upstream tag: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Skip when already merged
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.resolve.outputs.tag }}"
          $force = "${{ inputs.force }}"
          git remote add upstream "https://github.com/$env:UPSTREAM_REPO.git"
          # 上游提交与本仓库的同名发布标签不同，用独立引用防止抓取覆盖已发布标签。
          $upstreamRef = "refs/upstream-tags/$tag"
          git fetch --no-tags upstream "refs/tags/${tag}:${upstreamRef}"
          if ($LASTEXITCODE -ne 0) { throw '抓取上游标签失败' }
          git merge-base --is-ancestor $upstreamRef HEAD
          if ($LASTEXITCODE -notin @(0, 1)) { throw '检查上游合并状态失败' }
          $merged = $LASTEXITCODE -eq 0
          $released = $false
          if ($merged -and $force -ne 'true') {
            # 人工合并或发布失败后仍要补发；只有正式 Release 和完整附件齐全才能跳过。
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
            $headers = @{Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'}
            $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
            if ($response.StatusCode -eq 200) {
              $release = $response.Content | ConvertFrom-Json
              $assets = @($release.assets | Where-Object { $_.state -eq 'uploaded' -and $_.size -gt 0 } |
                ForEach-Object { $_.name })
              $released = -not $release.draft -and $assets -contains 'NoNo-win32-portable.zip' -and
                $assets -contains 'NoNo-win32-sha256.txt'
            } elseif ($response.StatusCode -ne 404) {
              throw "查询发布状态失败（HTTP $($response.StatusCode)），停止本次同步"
            }
          }
          if ($merged -and $released -and $force -ne 'true') {
            Write-Host "$tag 已合并且便携版本已发布，无需同步"
            "needed=false" >> $env:GITHUB_OUTPUT
          } else {
            if ($merged) { Write-Host "$tag 已合并，继续验证并补发或重试发布" }
            "needed=true" >> $env:GITHUB_OUTPUT
          }
          # merge-base 用 1 表示"不是祖先",这是正常分支,不能让步骤判失败
          exit 0

      - name: Merge upstream
        if: steps.check.outputs.needed == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.resolve.outputs.tag }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git merge --no-ff --no-edit "refs/upstream-tags/$tag"
          if ($LASTEXITCODE -eq 0) { exit 0 }

          # 我们删掉过 pyproject.toml / requirements.txt 里的 ok-script pin,上游每次
          # bump 版本都会改这两行,因此必然出现 "deleted by us"。这两处改动完全可
          # 脚本复现,取上游版本后交给 --reapply 重新删,不必叫人。
          $conflicts = git diff --name-only --diff-filter=U
          $auto = @('pyproject.toml', 'requirements.txt')
          $manual = $conflicts | Where-Object { $auto -notcontains $_ }
          if ($manual) {
            Write-Host "需要人工合并:$($manual -join ', ')"
            exit 1
          }
          foreach ($file in $conflicts) { git checkout --theirs -- $file }
          git add -- $conflicts
          git commit --no-edit

      - name: Re-vendor ok-script
        if: steps.check.outputs.needed == 'true'
        shell: pwsh
        run: |
          # 先在隔离树重放品牌与逻辑差异；验证成功后才移除依赖 pin 并整体替换。
          # 这一步只用标准库，先做重放再安装依赖，避免重新装入上游 ok-script。
          python scripts/sync_ok.py --reapply
          # 必须显式判负:脚本崩了但后面的 git 命令成功时,pwsh 步骤仍会判绿,
          # 结果是"合并干净、ok/ 没更新、测试全绿"——最坏的一种假成功。
          if ($LASTEXITCODE -ne 0) { throw 'sync_ok.py 执行失败' }
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host '框架源码无变化'
          } else {
            $version = (Get-Content selfhost/ok_pin.json -Raw | ConvertFrom-Json).version
            git commit -m "other: 同步内联框架 $version"
          }

      - name: 安装现有依赖
        if: steps.check.outputs.needed == 'true'
        shell: pwsh
        run: python .github/scripts/install_dependencies.py

      - name: 验证前台输入与自维护核心
        if: steps.check.outputs.needed == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: .\scripts\check_foreground.ps1

      - name: Push and tag
        if: steps.check.outputs.needed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.resolve.outputs.tag }}"
          # 沿用上游版本号，但首次发布指向本仓库适配提交；重试复用原标签，不移动历史版本。
          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) { throw '推送适配代码失败' }
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 1) {
            git tag -a $tag -m $tag
            if ($LASTEXITCODE -ne 0) { throw '创建发布标签失败' }
          } elseif ($LASTEXITCODE -ne 0) {
            throw '检查发布标签失败'
          }
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw '推送发布标签失败，未覆盖已有标签' }
          # 用 GITHUB_TOKEN 推的 tag 不会触发 build.yml(GitHub 禁止 token 递归
          # 触发 push 类事件),所以必须显式派发一次,否则源码合了、包没编译。
          # --repo 不能省:本仓库是 fork,gh 会把"仓库"解析成基仓库(上游),
          # 于是拿着只能访问自己仓库的 token 去派发上游的 build.yml → 403
          # "Resource not accessible by integration",而源码和标签已经推上去了。
          gh workflow run build.yml --ref $tag --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "派发 build.yml 失败(退出码 $LASTEXITCODE)" }
          Write-Host "已推送 $tag 并派发 build.yml"
