name: Windows 编译检查
run-name: Windows 编译 · ${{ github.sha }}

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-compile-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONUTF8: '1'
  QT_QPA_PLATFORM: offscreen

jobs:
  compile:
    name: 前台核心、原生 EXE 与便携包
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: 配置源码换行
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - name: 检出本次推送源码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: 安装现有依赖
        shell: pwsh
        run: python .github/scripts/install_dependencies.py

      - name: 校验框架来源与前台核心
        timeout-minutes: 20
        shell: pwsh
        run: .\scripts\check_foreground.ps1

      # 普通分支编译直接复用宿主脚本；该脚本包含七项原生进程验证，不创建发布版本。
      - name: 编译并验证原生业务 EXE
        shell: pwsh
        run: |
          .\scripts\build_runtime.ps1

      - name: 编译并核验本次新版启动器
        id: launcher
        uses: ./.github/actions/build-nono-launcher

      - name: 生成并验证本次 SHA 的完整便携包
        shell: pwsh
        env:
          BUILD_SHA: ${{ github.sha }}
        run: python -m selfhost.portable --source-sha "$env:BUILD_SHA" --launcher-exe build/launcher-dist/NoNo.exe --launcher-proof build/launcher-dist/launcher-build.json

      - name: 上传本次 SHA 的完整便携包
        id: portable_artifact
        uses: actions/upload-artifact@v7
        with:
          name: NoNo-portable-windows-${{ github.sha }}
          path: |
            build/portable-dist/NoNo-win32-portable.zip
            build/portable-dist/NoNo-win32-sha256.txt
            build/launcher-dist/launcher-build.json
          if-no-files-found: error
          retention-days: 14

      - name: 记录源码与产物
        shell: pwsh
        env:
          BUILD_SHA: ${{ github.sha }}
          PORTABLE_ARTIFACT_URL: ${{ steps.portable_artifact.outputs.artifact-url }}
        run: |
          "源码 SHA：$env:BUILD_SHA" >> $env:GITHUB_STEP_SUMMARY
          "完整便携包（含运行环境、依赖和原生入口）：[下载构建产物]($env:PORTABLE_ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
