[build-system]
requires = ["setuptools>=77", "cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "ok-ww"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "dulwich==1.2.21",
    "mcp==2.3.0",
    "ok-pyside-minimal==6.12.0.post2",
    "onnxocr-ppocrv5>=0.0.23",
    "openvino",
    "opencv-python",
    "pyappify[standalone]>=1.0.20",
    # >>> generated: vendored ok-script dependencies (scripts/sync_ok.py)
    # 来源: ok-script 3.0.5b8 的 wheel 元数据,由 scripts/sync_ok.py 生成。
    "pywin32!=312,>=306",
    "typing-extensions>=4.11.0",
    "requests>=2.32.3",
    "psutil>=6.0.0",
    "pydirectinput==1.0.4",
    "pycaw==20240210",
    "mouse==0.7.1",
    "pynput>=1.8.1",
    # <<< generated: vendored ok-script dependencies
]

[project.optional-dependencies]
dev = [
    "polib",
    "pytest",
    "PyYAML==6.0.3",
]
docs = [
    "mkdocs-material>=9.5,<10",
]
