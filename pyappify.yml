# 自维护分支的对外名字。启动器直接读这个字段:exe 名、解压目录名、
# data/apps/<name> 都从它派生(build.yml 会把启动器重命名为 NoNo.exe)。
name: "NoNo"
uac: true
icon: "icons/icon.png"
# website 原本是 http://ok-script.com/ok-ww(上游站点),自维护分支不再对外宣传,
# 该字段会出现在程序属性/关于信息里,故整行删除。上游 v3.7.20 新增的 keep_releases
# 予以保留:它控制发布页保留多少个历史 release。
keep_releases: 30

profiles:
  # 自维护分支:只保留一个 profile,指向自己的更新仓库 nono-update,不再从上游
  # 更新通道拉取。该仓库只有部署树(deploy.txt 白名单,发版时由 build.yml 的
  # partial-sync-repo 步骤推送),不含 ok_templates/tests 等开发素材(那些东西塞进去
  # 会让 setup 多克隆 900 MB,还会撞上 Windows 长路径限制)。
  #
  # 上游有 China / Global 两个 profile,区别原本只在 git_url 指向国内镜像还是
  # GitHub。我们把两边都指向同一个镜像仓库后,第二个 profile 的其余字段会通过
  # pyappify 的 apply_profile_inheritance() 全部继承自第一个(见 pyappify 的
  # src-tauri/src/app.rs),也就是两个安装包行为一致、只是同一份 224 MB 载荷被
  # NSIS 压了两遍,每次构建多花约 4 分钟。单机自用只需要一份,故删掉 Global。
  #
  # 名字保留 "China" 是为了兼容已有安装(profile 名会写进安装目录与
  # PYAPPIFY_APP_PROFILE,改名会让老安装回落到 default)。默认 profile 就是
  # 列表里的第一个。
  - name: "China"
    git_url: "https://github.com/Canda15/nono-update.git"
    admin: true
    # 原生宿主在自身进程执行 main.py，任务管理器显示 NoNo.exe；
    # 在发布时编译并随 selfhost/ 推入部署树，依赖更新仍由启动器负责。
    main_script: "selfhost/NoNo.exe"
    requires_python: "3.12"
    requirements: "requirements.txt"
    use_pythonw: true
    pip_args: "--no-deps"
    show_add_defender: true
    # PYTHONPATH: "your/default/path" # Optional, will be "" if missing
